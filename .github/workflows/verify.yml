name: Verify profile

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check generated profile
        run: python3 scripts/build_profile.py --check
      - name: Check local references and SVGs
        run: python3 scripts/check_profile.py
      - name: Test the evaluation lab
        run: python3 -m unittest discover -s examples/evaluation-lab -p 'test_*.py' -v
      - name: Run the synthetic example
        run: python3 examples/evaluation-lab/evaluate.py
